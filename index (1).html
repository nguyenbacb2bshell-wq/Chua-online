<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chùa Online – Chỗ ngồi thiền</title>
<style>

:root{--bg:#fbf3e4;--card:#fffaf0;--ink:#3b2a1a;--mute:#8a7357;--gold:#c8902e;--free:#f0e2c4;--taken:#b5452f;--me:#2f7d4f;--line:#e3d3b0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1610;--card:#2a2016;--ink:#f3e6cf;--mute:#b19c7c;--gold:#e0a94a;--free:#3b2e1e;--taken:#d9654d;--me:#4fb57a;--line:#4a3a26}}
:root[data-theme="dark"]{--bg:#1d1610;--card:#2a2016;--ink:#f3e6cf;--mute:#b19c7c;--gold:#e0a94a;--free:#3b2e1e;--taken:#d9654d;--me:#4fb57a;--line:#4a3a26}
html{color-scheme:light dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.45}
main{max-width:560px;margin:0 auto;padding:18px 14px 40px}
h1{font-size:1.5rem;margin:6px 0 2px;text-align:center}
.sub{text-align:center;color:var(--mute);margin:0 0 14px;font-size:.95rem}
.roof{height:46px;margin:0 auto -2px;max-width:420px;background:var(--gold);clip-path:polygon(50% 0,100% 100%,0 100%);opacity:.9}
.hall{background:var(--card);border:2px solid var(--gold);border-radius:12px;padding:12px;max-width:520px;margin:0 auto}
.altar{position:relative;max-width:400px;margin:0 auto 12px;border-radius:10px;overflow:hidden;border:2px solid var(--gold);box-shadow:0 0 18px rgba(255,200,90,.45)}.altar img{display:block;width:100%;height:auto}.altar .glow{position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen;background:radial-gradient(ellipse at 50% 42%,rgba(255,214,120,.38),rgba(255,170,60,.12) 45%,transparent 70%);animation:gl 3.2s ease-in-out infinite alternate}@keyframes gl{from{opacity:.35}to{opacity:1}}@media (prefers-reduced-motion:reduce){.altar .glow{animation:none}}
.grid{display:grid;grid-template-columns:repeat(5,1fr);grid-auto-rows:minmax(48px,auto);gap:6px}
.seat{border-radius:14px;border:2px solid var(--line);background:var(--free);color:var(--ink);font-size:.78rem;font-weight:600;line-height:1.15;cursor:pointer;padding:4px 5px;display:grid;place-items:center;text-align:center;overflow:hidden;overflow-wrap:anywhere;touch-action:manipulation}
.seat.taken,.seat.me{font-size:.72rem}.seat.taken{background:var(--taken);border-color:var(--taken);color:#fff;cursor:default}
.seat.me{background:var(--me);border-color:var(--me);color:#fff}
.seat:focus-visible{outline:3px solid var(--gold)}
.bar{display:flex;gap:8px;max-width:420px;margin:14px auto 0}
.bar input{flex:1;min-width:0;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:1rem}
.bar button,.leave{padding:10px 14px;border-radius:10px;border:0;background:var(--gold);color:#2a1a05;font-weight:700;font-size:1rem;cursor:pointer}
.stats{display:flex;justify-content:space-between;max-width:420px;margin:12px auto 0;font-size:.95rem}
.msg{max-width:420px;margin:10px auto 0;text-align:center;min-height:1.4em;color:var(--mute);font-size:.92rem}
.note{max-width:420px;margin:18px auto 0;font-size:.82rem;color:var(--mute);text-align:center}
.snd{display:flex;gap:8px;max-width:420px;margin:12px auto 0}.snd button{flex:1;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:.92rem;cursor:pointer}
.legend{display:flex;gap:14px;justify-content:center;margin-top:10px;font-size:.8rem;color:var(--mute)}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:4px;vertical-align:-1px}

.notice{max-width:520px;margin:0 auto 12px;padding:10px 12px;border-radius:10px;background:var(--gold);color:#2a1a05;font-weight:700;text-align:center}
.seat.lock{opacity:.5;cursor:not-allowed}
.snd select{flex:1;min-width:0;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:.95rem}
.conn{max-width:520px;margin:6px auto;text-align:center;color:var(--taken);font-size:.85rem}
</style>
</head>
<body>
<main>
<h1>🪷 Chùa Online</h1>
<p class="sub">Chọn một chỗ để ngồi thiền. Thoát ra là mất chỗ ngay.</p>
<div class="notice" id="notice" hidden></div>
<div class="hall">
<div class="altar"><img src="altar.jpg" alt="Chánh điện Đại Hùng Bảo Điện"><i class="glow"></i></div>
<div class="grid" id="grid" role="group" aria-label="Sơ đồ chỗ ngồi"></div>
<div class="legend"><span><i class="dot" style="background:var(--free);border:1px solid var(--line)"></i>Trống</span><span><i class="dot" style="background:var(--taken)"></i>Có người</span><span><i class="dot" style="background:var(--me)"></i>Chỗ của bạn</span></div>
</div>
<div class="bar"><input id="nick" maxlength="24" placeholder="Nhập tên của bạn" autocomplete="off"></div>
<div class="stats"><span id="count"></span><span id="timer"></span></div>
<div class="snd"><button id="bellBtn" type="button">🔔 Thỉnh chuông</button><button id="muteBtn" type="button">🔊 Tắt tiếng kinh</button></div>
<div class="snd"><select id="trackSel" aria-label="Chọn bài kinh"></select></div>
<div class="msg" id="msg">Nhập tên rồi bấm vào một chỗ trống để ngồi.</div>
<div class="conn" id="conn" hidden>Đang mất kết nối mạng…</div>
<div class="bar" id="leaveBar" hidden><button class="leave" id="leaveBtn" style="width:100%">Rời chỗ</button></div>
</main>
<audio id="kinh" loop preload="auto"></audio>
<script type="module">
import {firebaseConfig} from './firebase-config.js';
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import {getAuth,signInAnonymously,onAuthStateChanged} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import {getDatabase,ref,onValue,runTransaction,remove,onDisconnect} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js';
const $=id=>document.getElementById(id);
const grid=$('grid'),msg=$('msg'),nickEl=$('nick'),audio=$('kinh');
const setMsg=t=>{msg.textContent=t};
let myTrack='',uid=null,seats={},cfg={},mySeat=null,mySince=0,interacted=false,muted=false,lastBell=undefined,btns=[];
try{nickEl.value=localStorage.getItem('nick')||''}catch(e){}
if(firebaseConfig.apiKey==='DAN_VAO_DAY'){setMsg('Chưa dán thông tin Firebase vào file firebase-config.js.');throw new Error('no config');}
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getDatabase(app);

function buildGrid(n){
  grid.textContent='';btns=[];
  for(let s=1;s<=n;s++){const b=document.createElement('button');b.className='seat';b.type='button';b.dataset.s=s;b.textContent=String(s);b.setAttribute('aria-label','Chỗ số '+s);grid.appendChild(b);btns.push(b);}
}
function render(){
  const n=cfg.seats||100;if(btns.length!==n)buildGrid(n);
  const locked=cfg.locked||{};let taken=0;
  if(mySeat!==null&&!(seats[mySeat]&&seats[mySeat].uid===uid))lost();
  btns.forEach((b,i)=>{const s=i+1,e=seats[s];b.className='seat';b.title='';
    if(e){taken++;b.classList.add(e.uid===uid?'me':'taken');b.textContent=e.nick||String(s);b.title=e.nick||'';}
    else if(locked[s]){b.classList.add('lock');b.textContent='🔒 '+s;}
    else b.textContent=String(s);});
  $('count').textContent=taken+'/'+n+' chỗ có người';
  $('leaveBar').hidden=mySeat===null;
  if(mySeat!==null)setMsg('Bạn đang ngồi ở chỗ số '+mySeat+'. Đóng trang là chỗ tự trống.');
}
function lost(){
  const old=mySeat;mySeat=null;
  try{onDisconnect(ref(db,'seats/'+old)).cancel()}catch(e){}
  $('timer').textContent='';
  setMsg('Chỗ ngồi của bạn đã được giải phóng (do quản trị mời ra hoặc mất kết nối). Bạn có thể chọn chỗ khác.');
}
async function sit(s){
  if(!uid){setMsg('Đang kết nối, bạn thử lại sau giây lát.');return;}
  if(mySeat===s||seats[s]||(cfg.locked&&cfg.locked[s]))return;
  const nick=(nickEl.value.trim()||'Khách').slice(0,24);
  try{localStorage.setItem('nick',nick)}catch(e){}
  const r=ref(db,'seats/'+s);
  try{
    const res=await runTransaction(r,cur=>cur===null?{uid,nick,since:Date.now()}:undefined);
    if(!res.committed){try{await onDisconnect(r).cancel()}catch(e){}setMsg('Chỗ này vừa có người ngồi. Hãy chọn chỗ khác.');return;}
    await onDisconnect(r).remove();
    const old=mySeat;mySeat=s;mySince=Date.now();
    if(old!==null){try{await onDisconnect(ref(db,'seats/'+old)).cancel();await remove(ref(db,'seats/'+old));}catch(e){}}
    render();bell();interacted=true;applyAudio();
  }catch(e){
    try{await onDisconnect(r).cancel()}catch(_){}
    setMsg('Không ngồi được: '+(e.code||e.message));
  }
}
async function leave(){
  const s=mySeat;if(s===null)return;mySeat=null;
  try{await onDisconnect(ref(db,'seats/'+s)).cancel();await remove(ref(db,'seats/'+s));}catch(e){}
  $('timer').textContent='';render();setMsg('Bạn đã rời chỗ. Chỗ đã được giải phóng.');
}
grid.addEventListener('click',e=>{const b=e.target.closest('.seat');if(b)sit(+b.dataset.s);});
$('leaveBtn').addEventListener('click',leave);
setInterval(()=>{if(mySeat===null)return;const t=Math.floor((Date.now()-mySince)/1000);$('timer').textContent='⏱ '+Math.floor(t/60)+':'+String(t%60).padStart(2,'0');},1000);

/* âm thanh */
let AC=null;
function ctx(){if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(C)AC=new C();}if(AC&&AC.state==='suspended')AC.resume();return AC;}
function bell(){
  const a=ctx();if(!a)return;const t=a.currentTime;
  [[1,.5,7],[2.01,.28,5],[2.76,.2,4],[5.4,.1,2.5]].forEach(p=>{
    const o=a.createOscillator(),g=a.createGain();o.type='sine';o.frequency.value=196*p[0];
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(p[1],t+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t+p[2]);
    o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+p[2]+0.1);
  });
}
function applyAudio(){
  const id=(myTrack&&cfg.tracks&&cfg.tracks[myTrack])?myTrack:cfg.current;const tr=cfg.tracks&&cfg.tracks[id],u=tr&&tr.url;
  if(!u)return;
  if(audio.dataset.u!==u){audio.dataset.u=u;audio.src=u;}
  if(cfg.playing===false||muted){audio.pause();return;}
  if(interacted){const p=audio.play();if(p&&p.catch)p.catch(()=>{});}
}
document.addEventListener('pointerdown',e=>{
  if(e.target.closest&&e.target.closest('#muteBtn'))return;
  interacted=true;ctx();applyAudio();
});
$('bellBtn').addEventListener('click',bell);
$('muteBtn').addEventListener('click',function(){
  muted=!muted;this.textContent=muted?'🔇 Bật tiếng kinh':'🔊 Tắt tiếng kinh';
  if(muted)audio.pause();else{interacted=true;applyAudio();}
});

function fillTracks(){
  const sel=$('trackSel'),tr=cfg.tracks||{};
  sel.textContent='';
  const o0=document.createElement('option');o0.value='';o0.textContent='🎵 Theo chùa'+(tr[cfg.current]?' ('+tr[cfg.current].name+')':'');sel.appendChild(o0);
  Object.keys(tr).forEach(id=>{const o=document.createElement('option');o.value=id;o.textContent=tr[id].name;sel.appendChild(o);});
  if(myTrack&&!tr[myTrack])myTrack='';
  sel.value=myTrack;
  sel.parentNode.hidden=Object.keys(tr).length<1;
}
$('trackSel').addEventListener('change',function(){myTrack=this.value;interacted=true;ctx();applyAudio();});
/* dữ liệu thời gian thực */
onValue(ref(db,'config'),s=>{
  cfg=s.val()||{};
  const nt=$('notice');nt.textContent=cfg.notice||'';nt.hidden=!cfg.notice;
  if(lastBell!==undefined&&cfg.bell&&cfg.bell!==lastBell)bell();
  lastBell=cfg.bell||0;
  render();fillTracks();applyAudio();
},e=>setMsg('Không đọc được dữ liệu. Kiểm tra lại cấu hình Firebase.'));
onValue(ref(db,'seats'),s=>{seats=s.val()||{};render();});
onValue(ref(db,'.info/connected'),s=>{$('conn').hidden=s.val()===true;});
signInAnonymously(auth).catch(()=>setMsg('Không đăng nhập ẩn danh được. Hãy bật Anonymous trong Firebase.'));
onAuthStateChanged(auth,u=>{uid=u?u.uid:null;});
</script>
</body>
</html>
